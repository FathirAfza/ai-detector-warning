name: Release skill

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skill
        run: ./scripts/package.sh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-detector-risk-check.skill
          path: dist/ai-detector-risk-check.skill

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/ai-detector-risk-check.skill --clobber --repo "${{ github.repository }}"
